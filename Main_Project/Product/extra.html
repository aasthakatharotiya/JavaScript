<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- <div>
        <img src="https://images.squarespace-cdn.com/content/v1/604ed7f8cbfeea1a501bcf2f/1617769812937-SMYF1XAAAKAFKY5UQEEY/shipping-confirmation-loop-2.gif" alt="">
    </div> -->

    <div class="form_container" style="width: fit-content;position: fixed; top: 35%; left: 35%; z-index: 1000; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5), rgba(0,0,0,0.5)); color: white; padding: 20px; font-size: 22px; border: 1px solid #ddd; border-radius: 8px;">
        <div style="text-align: center; margin-bottom: 10px; color: rgb(250, 3, 98); font-weight: bolder; font-size: 22px;">
            <span id="productTitle"></span>
        </div>
        
        <br>
        <div class="qun" style="display: flex; justify-content: center; gap: 10px;">
            <span for="quantity">Quantity :</span>
            <input type="number" id="quantity" value="1" min="1" required style="border: none;">
        </div>

        <br><br>
        <div class="pay" style="display: flex; justify-content: center; align-items: center; gap: 10px;">
            <span for="payment" style="margin-top: 10px;">Payment Method :</span>
            <select id="payment" required style="border: none; color: black;">
                <option value="">Select Appropriate Option &nbsp;&nbsp;&nbsp;</option>
                <option value="cod">Cash on Delivery</option>
                <option value="online">Online Payment</option>
                <option value="phonepay">PhonePay</option>
                <option value="gpay">GPay</option>
            </select>
        </div>
        <br><br>
        <div style="display: flex; justify-content: space-between;">
            <button id="add_to_cart" style="padding-left: 20px; padding-right: 20px; width: fit-content; height: 40px; font-size: 20px; border: none; background-color: rgb(2, 162, 2); color: white; border-radius: 5px;">Add</button>
            <button id="cancel" style="padding-left: 20px; padding-right: 20px; height: 40px; font-size: 20px; border: none; background-color: rgb(255, 111, 0); color: white; border-radius: 5px;">Cancel</button>
        </div>
    </div>

</body>
</html>
