<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK MANAGE</title>
    <!-- <link rel="stylesheet" href="task.css"> -->
</head>
<body>
    <center>
        <h1>Task Manage</h1>
    </center>
    <div id="main">
        <div id="sec-1">
            <form action="">
                <h3>
                    <label for="">Enter Task :- </label>
                    <input id="task" type="text" id="task"> <br>


                    <label for="">Priority :- </label>
                    <select id="priority">
                        <option value="pr">Priority</option>
                        <option value="High">High</option>
                        <option value="Meduim">Meduim</option>
                        <option value="Low">Low</option>
                    </select>
                    <br>


                    <label for=""> Course Duration :- </label>
                    <input type="number" id="duration"> 


<!-- 
                    <input  type="checkbox">
                    <label for="">Favourite</label>
                    <br>
 -->

                    <input itemid="submit" type="submit" id="submit">
                    <button id="update" style="display: none;">update</button>
                
                </h3>   
            
            </form>
        </div>
        <div id="sec-1">
            <table>
                <!-- Dont change order of columns -->
                <thead>
                  <tr>
                    <th>Task</th>
                    <th>Priority</th>
                    <th>Duration</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                <!-- Append your output to tbody -->
                </tbody>
              </table>
        
        </div>
    </div>
</body>
</html>
<script>
    document.getElementById("submit").addEventListener("click", function(event) {
    event.preventDefault()

    let task = document.getElementById("task").value
    let pr = document.getElementById("priority").value
    let duration = document.getElementById("duration").value

    let tr = document.createElement("tr")

    let td1 = document.createElement("td")
    td1.innerHTML = task

    let td2 = document.createElement("td")
    td2.innerHTML = pr

    let td3 = document.createElement("td")
    td3.innerHTML = duration

    let td4 = document.createElement("td")
    
    let deleteBtn = document.createElement("button")
    deleteBtn.innerText = "Delete"

    deleteBtn.addEventListener("click", function() {
        tr.remove()
    })

    let editBtn = document.createElement("button")
    editBtn.innerText = "Edit"

    let update = document.getElementById("update")
    let submit = document.getElementById("submit")

    editBtn.addEventListener("click", function() {

        document.getElementById("task").value = task
        document.getElementById("priority").value = pr
        document.getElementById("duration").value = duration

        
        update.style.display = "inline"
        submit.style.display="none"


    })
    update.addEventListener("click",function()
    {
        let updatedTask = document.getElementById("task").value
        let updatedPriority = document.getElementById("priority").value
        let updatedDuration = document.getElementById("duration").value

        td1.innerHTML = updatedTask
        td2.innerHTML = updatedPriority
        td3.innerHTML = updatedDuration

        document.getElementById("task").value = ""
        document.getElementById("priority").value = ""
        document.getElementById("duration").value = ""
        document.getElementById("update").style.display = "none"
        document.getElementById("submit").style.display = "inline"

    update.style.display = "none"
        submit.style.display="inline"
    })

    td4.append(deleteBtn)
    td4.append(editBtn)

    tr.append(td1, td2, td3, td4)
    document.querySelector("tbody").append(tr)

    document.getElementById("task").value = ""
    document.getElementById("priority").value = ""
    document.getElementById("duration").value = ""
})
</script>
